# This monorepo app cannot be built with Nixpacks/Railpack.
# Coolify: Build Pack = Dockerfile, Base Directory = repo root (.),
# Dockerfile = directwerk-admin/Dockerfile, Port = 3001

[phases.setup]
cmds = ["echo 'Use Coolify Build Pack Dockerfile with directwerk-admin/Dockerfile (repo root context).' >&2 && exit 1"]
