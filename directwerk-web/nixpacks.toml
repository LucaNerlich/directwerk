# This monorepo app cannot be built with Nixpacks/Railpack.
# Coolify: Build Pack = Dockerfile, Base Directory = repo root (.),
# Dockerfile = directwerk-web/Dockerfile, Port = 3004

[phases.setup]
cmds = ["echo 'Use Coolify Build Pack Dockerfile with directwerk-web/Dockerfile (repo root context).' >&2 && exit 1"]
