info:
  name: 8c - Notify Preview Episode
  type: http
  seq: 82

http:
  method: GET
  url: "{{baseUrl}}/api/v1/episodes/{{podcastEpisodeId}}/notify-preview"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 403 || res.getStatus() === 404).to.equal(true);
        });

        test("preview shape when ok", function() {
          if (res.getStatus() !== 200) {
            return;
          }
          const data = res.body.data;
          expect(typeof data.estimatedRecipients).to.equal("number");
          expect(typeof data.notifyAvailable).to.equal("boolean");
          expect(typeof data.canRetry).to.equal("boolean");
          expect("emailNotifiedAt" in data).to.equal(true);
          expect("jobStatus" in data).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Studio EMAIL_NOTIFY preview: opted-in recipient estimate, last claim, content-notify job status.
  Run after 8b when testing failure recovery; canRetry is true for FAILED / never-sent published episodes.
