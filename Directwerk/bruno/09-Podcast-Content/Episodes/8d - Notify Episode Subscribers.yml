info:
  name: 8d - Notify Episode Subscribers
  type: http
  seq: 83

http:
  method: POST
  url: "{{baseUrl}}/api/v1/episodes/{{podcastEpisodeId}}/notify"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(
            res.getStatus() === 200
              || res.getStatus() === 403
              || res.getStatus() === 404
              || res.getStatus() === 409
          ).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Send or retry subscriber notification for a PUBLISHED episode (studio failure recovery).
  Requires EMAIL_NOTIFY + canRetry from 8c. 409 when job is in flight or already completed successfully.
