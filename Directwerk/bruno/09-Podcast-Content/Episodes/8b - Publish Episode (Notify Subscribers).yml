info:
  name: 8b - Publish Episode (Notify Subscribers)
  type: http
  seq: 81

http:
  method: POST
  url: "{{baseUrl}}/api/v1/episodes/{{podcastEpisodeId}}/publish"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "notifySubscribers": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 400 || res.getStatus() === 403 || res.getStatus() === 404).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requires EMAIL_NOTIFY module. Run 02-Me/8 and 06-Platform-Admin/Modules/7 first.
