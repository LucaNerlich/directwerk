info:
  name: 13 - Unarchive Episode
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/api/v1/episodes/{{podcastEpisodeId}}/unarchive"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 400 || res.getStatus() === 404).to.equal(true);
        });
        test("restores draft status when successful", function() {
          if (res.getStatus() === 200) {
            expect(res.body.data.status).to.equal("DRAFT");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Requires an ARCHIVED episode — run 12 - Archive Episode first.
  400 INVALID_PUBLICATION_TRANSITION if status is not ARCHIVED.
