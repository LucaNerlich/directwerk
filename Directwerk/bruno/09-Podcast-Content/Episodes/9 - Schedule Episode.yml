info:
  name: 9 - Schedule Episode
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/v1/episodes/{{podcastEpisodeId}}/schedule"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "scheduledAt": "{{scheduledAt}}",
        "notifySubscribers": false
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("scheduledAt", new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString());
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 400 || res.getStatus() === 404).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
