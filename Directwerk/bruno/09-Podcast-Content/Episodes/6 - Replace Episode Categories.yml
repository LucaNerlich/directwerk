info:
  name: 6 - Replace Episode Categories
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/episodes/{{podcastEpisodeId}}/categories"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "categoryIds": [{{podcastCategoryId}}]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
