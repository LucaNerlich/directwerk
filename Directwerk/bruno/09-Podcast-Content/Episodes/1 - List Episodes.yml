info:
  name: 1 - List Episodes
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/episodes?limit=100&offset=0"
  params:
    - name: limit
      value: "100"
      type: query
      description: 1-500, default 100. Bounds the collection so a large tenant does not serialise every row (#310).
    - name: offset
      value: "0"
      type: query
      description: Rows to skip (default 0). Studio list pages page with limit+offset via the tenant BFF.
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

        test("episode views expose coverImageUrl", function() {
          const data = res.body && res.body.data;
          const episodeId = Number(bru.getVar("podcastEpisodeId"));
          const episode = Array.isArray(data)
            ? data.find((item) => item.id === episodeId)
            : undefined;
          expect(episode).to.not.equal(undefined);
          expect('coverImageUrl' in episode).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
