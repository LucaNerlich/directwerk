info:
  name: 2b - Ingest Remote Asset Async
  type: http
  seq: 2.5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/podcast/import/assets"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "sourceUrl": "https://example.com/cover.jpg",
        "assetType": "IMAGE",
        "visibility": "PUBLIC",
        "waitForCompletion": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect([202, 400, 403, 503]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Starts a background remote ingest and returns a PENDING asset immediately.
  Work runs on the remote-asset-ingest job queue; poll GET /api/v1/podcast/import/assets/{id} for progress.
