info:
  name: 2 - Create Category
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/categories"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "slug": "{{podcastCategorySlug}}",
        "name": "Harness Category"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("podcastCategorySlug", "category-" + Date.now().toString(36));
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 201 || res.getStatus() === 500).to.equal(true);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data && res.body.data.id
        method: jsonq
      variable:
        name: podcastCategoryId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Same live-observed 500 as Formats/2 - Create Format -- see its docs note.
