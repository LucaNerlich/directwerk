info:
  name: 5 - Clear Category Parent
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/categories/{{podcastCategoryId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "clearParentId": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

        test("#530 clearParentId lifts the parent", function() {
          expect(res.getBody().data.parentId === null).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
