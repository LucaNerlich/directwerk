info:
  name: 3 - Update Category
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/categories/{{podcastCategoryId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "slug": "{{podcastCategorySlug}}",
        "name": "Harness Category Updated",
        "active": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
