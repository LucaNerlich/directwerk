info:
  name: 1 - List Series
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/series?limit=100"
  params:
    - name: limit
      value: "100"
      type: query
      description: 1-500, default 100. Bounds the collection so a large tenant does not serialise every row (#310).
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
