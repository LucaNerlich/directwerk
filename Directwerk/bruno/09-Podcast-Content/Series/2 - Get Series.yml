info:
  name: 2 - Get Series
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/series/{{podcastSeriesId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 404).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Response now includes rssUrl (null unless PODCAST_RSS is enabled for the tenant).
