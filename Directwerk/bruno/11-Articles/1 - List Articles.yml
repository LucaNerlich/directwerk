info:
  name: List Articles
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/articles?limit=100&offset=0"
  params:
    - name: limit
      value: "100"
      type: query
      description: 1-500, default 100. Bounds the collection so a large tenant does not serialise every row (#310).
    - name: offset
      value: "0"
      type: query
      description: Rows to skip (default 0), not pageIndex×limit — non-multiples of limit are valid (e.g. offset=50&limit=100).
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect([200, 403].includes(res.getStatus())).to.equal(true);
        });

        test("article views expose heroImageUrl", function() {
          if (res.getStatus() !== 200) {
            return;
          }
          const data = res.body && res.body.data;
          expect(Array.isArray(data)).to.equal(true);
          if (data.length === 0) {
            return;
          }
          expect('heroImageUrl' in data[0]).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
