info:
  name: 5 - Replace Article Categories
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/articles/{{articleId}}/categories"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "categoryIds": [{{podcastCategoryId}}]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Optional — requires podcastCategoryId from 09-Podcast-Content/Categories/2 - Create Category.
