info:
  name: 6b - Publish Article (Notify Subscribers)
  type: http
  seq: 61

http:
  method: POST
  url: "{{baseUrl}}/api/v1/articles/{{articleId}}/publish"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "notifySubscribers": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 403).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Requires EMAIL_NOTIFY module. Run 06-Platform-Admin/Modules/7 (activate EMAIL_NOTIFY),
  16-Newsletter-Lists/2 (create ACTIVE list), 16-Newsletter-Lists/4 (attach list to article),
  and 16-Newsletter-Lists/3 (public subscribe) + confirm before publish.
  Article notify fans out to ACTIVE newsletter list subscribers (not membership opt-in).
  Sends only on first publish (email_notified_at guard). Deep links use /de|en/... paths.
