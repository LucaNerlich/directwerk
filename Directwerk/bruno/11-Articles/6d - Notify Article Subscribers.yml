info:
  name: 6d - Notify Article Subscribers
  type: http
  seq: 63

http:
  method: POST
  url: "{{baseUrl}}/api/v1/articles/{{articleId}}/notify"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(
            res.getStatus() === 200
              || res.getStatus() === 403
              || res.getStatus() === 404
              || res.getStatus() === 409
          ).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Send or retry newsletter for a PUBLISHED article. Requires ≥1 ACTIVE attached list and EMAIL_NOTIFY.
