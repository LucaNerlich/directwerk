info:
  name: Create Article Draft
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/articles"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "slug": "{{articleSlug}}",
        "title": "Bruno test article",
        "body": "<p>Hello from the newsletter desk.</p>",
        "excerpt": "Created from Bruno for newsletter desk testing.",
        "accessPolicy": "FREE",
        "categoryIds": []
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("articleSlug", "article-" + Date.now().toString(36));
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 201 || res.getStatus() === 403).to.equal(true);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: "res.getStatus() === 201 ? res.body.data.id : undefined"
        method: jsonq
      variable:
        name: articleId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: "res.getStatus() === 201 ? res.body.data.slug : undefined"
        method: jsonq
      variable:
        name: articleSlug
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
