info:
  name: 6 - Publish Article
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/articles/{{articleId}}/publish"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "notifySubscribers": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  400 ARTICLE_VALIDATION_FAILED if title or body is missing after sanitization.
  Set notifySubscribers true to enqueue EMAIL_NOTIFY fan-out (first publish only; subscribers must opt in).
  Optional publishedAt (ISO instant, not in the future) backdates the publication timestamp; omit for now.
