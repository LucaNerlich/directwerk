info:
  name: 6c - Notify Preview Article
  type: http
  seq: 62

http:
  method: GET
  url: "{{baseUrl}}/api/v1/articles/{{articleId}}/notify-preview"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 403 || res.getStatus() === 404).to.equal(true);
        });

        test("preview shape when ok", function() {
          if (res.getStatus() !== 200) {
            return;
          }
          const data = res.body.data;
          expect(typeof data.estimatedRecipients).to.equal("number");
          expect(typeof data.notifyAvailable).to.equal("boolean");
          expect(typeof data.canRetry).to.equal("boolean");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Studio EMAIL_NOTIFY preview for articles: deduped ACTIVE-list recipients + last content-notify job.
  Prefer {{articleNotifyId}} from the 6b harness when testing notify recovery.
