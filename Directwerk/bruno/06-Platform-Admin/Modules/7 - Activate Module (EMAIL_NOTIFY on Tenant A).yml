info:
  name: 7 - Activate Module (EMAIL_NOTIFY on Tenant A)
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/platform/tenants/{{tenantAId}}/modules/EMAIL_NOTIFY/activate"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 409).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requires DIGITAL_CONTENT and SUBSCRIPTION active on tenant A. Needed for publish notifySubscribers emails.
