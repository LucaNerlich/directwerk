info:
  name: 5 - Delete Media (Platform)
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/platform/tenants/{{tenantAId}}/media/{{platformMediaAssetId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect([200, 404, 409, 503].includes(res.getStatus())).to.equal(true);
          if (res.getStatus() === 409) {
            expect(res.getBody().errors[0].code).to.equal("MEDIA_ASSET_IN_USE");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
