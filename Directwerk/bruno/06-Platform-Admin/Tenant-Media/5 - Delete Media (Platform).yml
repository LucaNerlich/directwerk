info:
  name: 5 - Delete Media (Platform)
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/platform/tenants/{{tenantAId}}/media/{{platformMediaAssetId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 404 || res.getStatus() === 503).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
