info:
  name: 1 - List Platform Admins
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/platform/admins"
  params:
    - name: page
      value: "0"
      type: query
      description: Zero-based page index.
    - name: size
      value: "100"
      type: query
      description: Page size, 1-100. The list is paged rather than unbounded.
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

        test("returns paging metadata", function() {
          expect(res.body.metadata).to.be.an("object");
          expect(res.body.metadata.page).to.equal(0);
          expect(res.body.metadata.size).to.equal(100);
          expect(res.body.metadata.totalElements).to.be.a("number");
        });

        test("includes last login field", function() {
          expect(res.body.data).to.be.an("array");
          if (res.body.data.length > 0) {
            expect(res.body.data[0]).to.have.property("lastLoginAt");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
