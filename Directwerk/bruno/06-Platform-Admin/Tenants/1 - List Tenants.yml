info:
  name: 1 - List Tenants
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/platform/tenants"
  params:
    - name: page
      value: "0"
      type: query
      description: Zero-based page index.
    - name: size
      value: "100"
      type: query
      description: Page size, 1-100. Tenants were previously truncated at 1000 with no paging.
    - name: q
      value: ""
      type: query
      description: Optional estate-wide search over name, slug and custom domains (issue #551). Blank returns the unfiltered page.
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

        test("returns paging metadata", function() {
          expect(res.body.metadata).to.be.an("object");
          expect(res.body.metadata.page).to.equal(0);
          expect(res.body.metadata.size).to.equal(100);
          expect(res.body.metadata.totalElements).to.be.a("number");
        });

        test("includes list metadata fields", function() {
          const tenant = res.body.data.content.find(t => t.slug === "alpha-show-a");
          expect(tenant).to.be.an("object");
          expect(tenant.createdAt).to.be.a("string");
          expect(tenant.primaryDomain).to.be.a("string");
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: (res.body.data.content.find(t => t.slug === "alpha-show-a") || {}).id
        method: jsonq
      variable:
        name: tenantAId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: (res.body.data.content.find(t => t.slug === "alpha-show-b") || {}).id
        method: jsonq
      variable:
        name: tenantBId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
