info:
  name: 7 - Update Tenant
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/platform/tenants/{{tenantCId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Alpha Show C Renamed",
        "contactEmail": "podcast@alpha-show-c.local"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 404 || res.getStatus() === 409).to.equal(true);
          if (res.getStatus() === 200) {
            expect(res.body.data.contactEmail).to.equal("podcast@alpha-show-c.local");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Renames tenant C (captured as tenantCId by 2 - Create Tenant). Name, slug, and contactEmail are
  optional -- omitting a field leaves it unchanged. Blank contactEmail clears the podcast RSS owner
  address. 409 TENANT_SLUG_EXISTS if slug collides with another tenant.
