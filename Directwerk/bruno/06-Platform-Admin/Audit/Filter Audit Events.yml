info:
  name: Filter Audit Events
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/platform/audit"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
    - name: action
      value: TENANT_CREATED
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

        test("returns filtered audit payload", function() {
          expect(res.body.data).to.be.an("array");
          expect(res.body.metadata.totalElements).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
