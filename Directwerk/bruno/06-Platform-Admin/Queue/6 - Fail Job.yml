info:
  name: 6 - Fail Job
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/platform/queue/jobs/{{queueJobId}}/fail"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "worker": "bruno-worker",
        "error": "harness test failure",
        "retryDelaySeconds": 30
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 404 || res.getStatus() === 409).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 409 if the job isn't in a failable state (e.g. already claimed/completed by a previous run).
