info:
  name: 4 - Claim Jobs
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/platform/queue/jobs/claim"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "queue": "email",
        "worker": "bruno-worker",
        "limit": 5,
        "leaseSeconds": 60
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
