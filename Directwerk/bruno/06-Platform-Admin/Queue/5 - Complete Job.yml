info:
  name: 5 - Complete Job
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/platform/queue/jobs/{{queueJobId}}/complete"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "worker": "bruno-worker"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 404).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
