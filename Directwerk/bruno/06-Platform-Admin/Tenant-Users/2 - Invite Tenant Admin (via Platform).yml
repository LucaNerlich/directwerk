info:
  name: 2 - Invite Tenant Admin (via Platform)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/platform/tenants/{{tenantAId}}/users/invite"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "new-admin@alpha-show.local",
        "name": "New Tenant Admin",
        "role": "TENANT_ADMIN"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("inviteToken", res.body.data && res.body.data.inviteToken);
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 201 || res.getStatus() === 409).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
