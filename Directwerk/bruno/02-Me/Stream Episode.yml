info:
  name: Stream Episode
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/me/episodes/{{podcastEpisodeSlug}}/stream"
  headers:
    - name: Accept
      value: "*/*"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 302 || res.getStatus() === 400 || res.getStatus() === 403 || res.getStatus() === 404).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 302 redirect to signed/CDN audio URL when the episode is published READY and entitled. Set podcastEpisodeSlug from 09-Podcast-Content/Episodes first.
