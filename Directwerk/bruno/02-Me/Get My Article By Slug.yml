info:
  name: Get My Article By Slug
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/v1/me/articles/{{myArticleSlug}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 404 || res.getStatus() === 403).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Entitled single-article read, tracks article-view private-view. 403 if DIGITAL_CONTENT off.
