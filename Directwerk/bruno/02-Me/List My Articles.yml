info:
  name: List My Articles
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/me/articles"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 403).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  403 if DIGITAL_CONTENT module is off for the tenant.
  Entitled articles may include `heroImageUrl` (public CDN).
