info:
  name: List My Episodes
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/me/episodes"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 403).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  403 if PODCAST module is off for the tenant.
  Entitled episodes may include `coverImageUrl` (public CDN artwork).
