info:
  name: Get My Effective Rights
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/me/effective-rights"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Own server-resolved rights matrix (FULL | OWN_ONLY | DENIED per entity and operation) plus restriction rows. Drives studio UI adaptation; the backend still enforces authoritatively per row.
