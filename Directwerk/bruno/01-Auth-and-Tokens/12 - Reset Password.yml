info:
  name: 12 - Reset Password
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/reset-password"
  headers:
    - name: Host
      value: "{{tenantAHost}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{passwordResetToken}}",
        "newPassword": "{{seedPassword}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 400).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
