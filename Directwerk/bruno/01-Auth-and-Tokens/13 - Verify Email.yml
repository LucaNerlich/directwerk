info:
  name: 13 - Verify Email
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/verify-email"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{emailVerificationToken}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 400).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Manual/dev-cloud path -- fill in emailVerificationToken yourself. Directwerk always requires
  verification before a self-registered subscriber can log in (there's no profile that skips it);
  on local, prefer 6 - Auto-Verify Email (Mailpit, local only) instead of doing this by hand. Against
  a deployed environment, check the real inbox for the 'Verify your email address' message, copy the
  token out of its verification link's ?token= query param, paste it into emailVerificationToken
  below, then run this request. We deliberately do not automate this step outside local dev -- email
  ownership verification is a security control, not busywork to script around.
