info:
  name: 11 - Forgot Password
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/forgot-password"
  headers:
    - name: Host
      value: "{{tenantAHost}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{subscriberEmail}}"
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("passwordResetToken", res.body.data && res.body.data.devResetToken);
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 202).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: devResetToken only present when directwerk.account.expose-dev-tokens=true (local profile).
