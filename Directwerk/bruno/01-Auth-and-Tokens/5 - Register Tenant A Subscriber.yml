info:
  name: 5 - Register Tenant A Subscriber
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  headers:
    - name: Host
      value: "{{tenantAHost}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{subscriberEmail}}",
        "password": "{{seedPassword}}",
        "name": "Test Subscriber"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 201 || res.getStatus() === 409).to.equal(true);
        });
        test("201 first run, 409 if already registered", function() {});

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
