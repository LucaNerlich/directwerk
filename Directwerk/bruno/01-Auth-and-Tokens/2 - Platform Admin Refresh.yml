info:
  name: 2 - Platform Admin Refresh
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/oauth2/token"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: refresh_token
      - name: refresh_token
        value: "{{platformRefreshToken}}"
      - name: client_id
        value: "{{platformClientId}}"
  auth:
    type: basic
    username: "{{platformClientId}}"
    password: "{{platformClientSecret}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("platformAccessToken", res.body.access_token);
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
