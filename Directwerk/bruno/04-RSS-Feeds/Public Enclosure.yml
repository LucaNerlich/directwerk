info:
  name: Public Enclosure
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/feeds/{{tenantASlug}}/e/{{podcastEpisodeSlug}}.mp3"
  headers:
    - name: Accept
      value: "*/*"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          const status = res.getStatus();
          expect(status === 302 || status === 403 || status === 404).to.equal(true);
          if (status === 403) {
            expect(res.body.errors[0].code).to.equal("FEATURE_NOT_ENABLED");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: RssFeedController public enclosure proxy. Requires PODCAST + PODCAST_RSS.
