info:
  name: 8 - List Media Folders
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v1/media/folders"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 503).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Flat folder list (id, name, parentId); clients build the tree. Null parentId means library root.
