info:
  name: 12 - Move Media Asset
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/v1/media/{{mediaAssetId}}/move"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "folderId": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 404 || res.getStatus() === 503).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Set folderId to {{mediaFolderId}} to file the asset, null to move it back to the library root. S3 keys are untouched — folders are metadata only.
