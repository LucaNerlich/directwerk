info:
  name: 5 - Get Preview URL
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/media/{{mediaAssetId}}/preview-url"
  params:
    - name: previewDraft
      value: "true"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 400 || res.getStatus() === 404 || res.getStatus() === 503).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
