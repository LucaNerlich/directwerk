info:
  name: 10 - Move Media Folder
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/v1/media/folders/{{mediaFolderId}}/move"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "parentId": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 404 || res.getStatus() === 503).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Null parentId moves the folder to the library root. Self/cycle parents and moves beyond depth 8 are rejected with 400.
