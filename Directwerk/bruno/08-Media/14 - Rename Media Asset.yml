info:
  name: 14 - Rename Media Asset
  type: http
  seq: 14

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/media/{{mediaAssetId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "filename": "interview-final.mp3"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 400 || res.getStatus() === 404 || res.getStatus() === 503).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Renames the asset display filename (originalFilename). The S3 key stays untouched — folders and renames are metadata only. Invalid names return 400.
