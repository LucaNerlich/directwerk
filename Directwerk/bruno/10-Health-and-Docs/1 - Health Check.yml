info:
  name: 1 - Health Check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/actuator/health"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });
        test("status is UP", function() {
          expect(res.body.status).to.equal("UP");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
