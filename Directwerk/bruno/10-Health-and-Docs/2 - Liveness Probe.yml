info:
  name: 2 - Liveness Probe
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/actuator/health/liveness"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });
        test("status is UP", function() {
          expect(res.body.status).to.equal("UP");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |
  Docker/Coolify probe endpoint. Does not include mail — SMTP timeouts must not
  mark the process unhealthy.
