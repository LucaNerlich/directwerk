info:
  name: Public Article by Slug
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/v1/public/articles/{{articleSlug}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 404).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requires articleSlug from 11-Articles/3 - Create Article Draft (after publish) or a known published slug.
