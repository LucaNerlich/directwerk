info:
  name: 03-Public
  type: folder
  seq: 3

request:
  headers:
    - name: Host
      value: "{{tenantAHost}}"

docs:
  content: |-
    No auth on the catalog requests -- tenant is resolved purely from the Host header.
    Includes public podcast endpoints and public article list/detail (PublicArticleController).
    Search documents is the exception: the guest request is anonymous, and the lower/higher
    tier requests send a subscriber bearer so paid plainText follows that caller's entitlements.
  type: text/markdown
