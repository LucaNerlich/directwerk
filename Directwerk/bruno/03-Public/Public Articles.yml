info:
  name: Public Articles
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v1/public/articles"
  params:
    - name: limit
      value: "50"
      type: query
      disabled: true
    - name: offset
      value: "0"
      type: query
      disabled: true

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Published articles for the tenant host, paged with `limit` (1-200, default 50)
  and `offset`. Each item may include `heroImageUrl` (public CDN) when a public
  hero asset is attached.
