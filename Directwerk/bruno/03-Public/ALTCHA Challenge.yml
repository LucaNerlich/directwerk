info:
  name: ALTCHA Challenge
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/public/altcha/challenge"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns challenge JSON", function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.include("challenge");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
