info:
  name: Public Episode by Slug
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/api/v1/public/episodes/{{podcastEpisodeSlug}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 404).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Requires podcastEpisodeSlug from a published episode (published series).
  FREE and PAID published episodes return 200; PAID may omit audioCdnUrl.
  Unknown / unpublished / series-unpublished → 404 EPISODE_NOT_FOUND.
