info:
  name: 1 - List Digital Publications
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/digital-publications"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });
        test("returns an array of publications", function() {
          expect(res.body.data).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lists bonus DigitalPublication rows for the tenant (BONUS_CONTENT module).
