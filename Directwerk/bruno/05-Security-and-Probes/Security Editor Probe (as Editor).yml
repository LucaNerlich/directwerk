info:
  name: Security Editor Probe (as Editor)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/security/editor"
  auth:
    type: bearer
    token: "{{editorAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
