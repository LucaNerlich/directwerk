info:
  name: 4 - Platform Admin Denied On Security Context
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/security/context"
  headers:
    - name: Host
      value: "{{tenantAHost}}"
  auth:
    type: bearer
    token: "{{platformAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 403 || res.getStatus() === 500).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
