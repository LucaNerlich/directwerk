info:
  name: 7 - Get Verification Challenge
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenant/domains/{{isolationUnverifiedHost}}/verification"
  headers:
    - name: Host
      value: "{{tenantAHost}}"
  auth:
    type: bearer
    token: "{{tenantAAccessToken}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("isolationVerifyToken", res.body.data && res.body.data.token);
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
