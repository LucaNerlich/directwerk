info:
  name: 6 - Create Custom Article Feed Missing Categories
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/me/article-feeds"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Missing categories",
        "categoryIds": []
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("requires at least one category", function() {
          expect(res.getStatus()).to.equal(400);
          expect(res.body.errors[0].code).to.equal("FEED_CATEGORIES_REQUIRED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
