info:
  name: 5 - Create Custom Article Feed Duplicate Title
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/me/article-feeds"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "{{customArticleFeedTitle}}",
        "categoryIds": [{{articleCategoryId}}]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects a duplicate custom title", function() {
          expect(res.getStatus()).to.equal(409);
          expect(res.body.errors[0].code).to.equal("FEED_TITLE_DUPLICATE");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Custom titles are unique per user+tenant (case-insensitive).
