info:
  name: 12 - Enable Custom Feed
  type: http
  seq: 12

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/me/feeds/{{customFeedId}}/enabled"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "enabled": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("re-enables the custom feed", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body.data.enabled).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
