info:
  name: 4 - Create Custom Feed
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/me/feeds"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "{{customFeedTitle}}",
        "formatIds": [{{podcastFormatId}}]
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("customFeedTitle", "Custom-" + Date.now().toString(36));
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("customFeedId", res.body.data.id);
          bru.setVar("customFeedUrl", res.body.data.url);
        }
    - type: tests
      code: |-
        test("creates a custom feed", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.body.data.isDefault).to.equal(false);
          expect(res.body.data.enabled).to.equal(true);
          expect(res.body.data.formatIds).to.be.an("array").that.is.not.empty;
          expect(res.body.data.url).to.include("/feeds/");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: POST /api/v1/me/feeds — Formate-only custom private RSS. Max 5 per user/tenant.
