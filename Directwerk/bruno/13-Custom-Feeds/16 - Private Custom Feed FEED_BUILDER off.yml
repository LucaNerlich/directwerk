info:
  name: 16 - Private Custom Feed FEED_BUILDER off
  type: http
  seq: 16

http:
  method: GET
  url: "{{customFeedUrl}}"
  headers:
    - name: Accept
      value: application/rss+xml

runtime:
  scripts:
    - type: before-request
      code: |-
        function platformRequest(opts) {
          return new Promise((resolve, reject) => {
            bru.sendRequest(opts, (err, resp) => {
              if (err) return reject(err);
              resolve(resp);
            });
          });
        }
        const baseUrl = bru.getEnvVar("baseUrl");
        const tenantAId = bru.getVar("tenantAId") || bru.getEnvVar("tenantAId");
        const token = bru.getVar("platformAccessToken") || bru.getEnvVar("platformAccessToken");
        await platformRequest({
          url: baseUrl + "/api/v1/platform/tenants/" + tenantAId + "/modules/FEED_BUILDER",
          method: "DELETE",
          headers: {
            Authorization: "Bearer " + token,
            Accept: "application/json"
          }
        });
    - type: after-response
      code: |-
        function platformRequest(opts) {
          return new Promise((resolve, reject) => {
            bru.sendRequest(opts, (err, resp) => {
              if (err) return reject(err);
              resolve(resp);
            });
          });
        }
        const baseUrl = bru.getEnvVar("baseUrl");
        const tenantAId = bru.getVar("tenantAId") || bru.getEnvVar("tenantAId");
        const token = bru.getVar("platformAccessToken") || bru.getEnvVar("platformAccessToken");
        try {
          await platformRequest({
            url: baseUrl + "/api/v1/platform/tenants/" + tenantAId + "/modules/FEED_BUILDER/activate",
            method: "POST",
            headers: {
              Authorization: "Bearer " + token,
              Accept: "application/json"
            }
          });
        } catch (error) {
          console.error("Failed to restore FEED_BUILDER after custom feed gate check", error);
          throw error;
        }
    - type: tests
      code: |-
        test("custom feed is 404 (not JSON 403) when FEED_BUILDER is off", function() {
          expect(res.getStatus()).to.equal(404);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Podcatchers must see a 404 no-store, not FEATURE_NOT_ENABLED JSON, when FEED_BUILDER is off.
  Restores FEED_BUILDER in post-response even when the assertion fails.
