info:
  name: 1 - Ensure FEED_BUILDER enabled
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/platform/tenants/{{tenantAId}}/modules/FEED_BUILDER/activate"
  auth:
    type: bearer
    token: "{{platformAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("FEED_BUILDER enabled", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 409).to.equal(true);
          if (res.getStatus() === 200) {
            expect(res.body.data.enabledModules.includes("FEED_BUILDER")).to.equal(true);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Activates FEED_BUILDER on tenant A (needs PODCAST_RSS + SUBSCRIPTION).
