info:
  name: 7 - Update Custom Feed
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/me/feeds/{{customFeedId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "{{customFeedTitle}} updated",
        "formatIds": [{{podcastFormatId}}]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("updates title and formats", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body.data.title).to.include("updated");
          expect(res.body.data.isDefault).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: PUT /api/v1/me/feeds/{id} — cannot filter the default feed (DEFAULT_FEED_NOT_FILTERABLE).
