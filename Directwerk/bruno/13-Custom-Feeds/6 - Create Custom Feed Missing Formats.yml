info:
  name: 6 - Create Custom Feed Missing Formats
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/me/feeds"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Missing formats",
        "formatIds": []
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("requires at least one format", function() {
          expect(res.getStatus()).to.equal(400);
          expect(res.body.errors[0].code).to.equal("FEED_FORMATS_REQUIRED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
