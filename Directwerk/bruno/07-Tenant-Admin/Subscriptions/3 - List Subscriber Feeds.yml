info:
  name: 3 - List Subscriber Feeds
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenant/subscriber-feeds"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns tenant subscriber feeds", function() {
          expect(res.getStatus()).to.equal(200);
          expect(Array.isArray(res.body.data)).to.equal(true);
          expect(typeof res.body.data[0].userEmail).to.equal("string");
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data && res.body.data[0] && res.body.data[0].id
        method: jsonq
      variable:
        name: subscriberFeedId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
