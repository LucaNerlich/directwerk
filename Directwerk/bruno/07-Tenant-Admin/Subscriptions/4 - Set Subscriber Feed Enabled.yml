info:
  name: 4 - Set Subscriber Feed Enabled
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/tenant/subscriber-feeds/{{subscriberFeedId}}/enabled"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "enabled": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("toggles subscriber feed enabled", function() {
          expect(res.getStatus()).to.equal(200);
          expect(typeof res.body.data.enabled).to.equal("boolean");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 'Requires subscriberFeedId from "3 - List Subscriber Feeds". Set "enabled": true to re-enable.'
