info:
  name: 1 - List Subscribers
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenant/subscribers"
  params:
    - name: page
      value: "0"
      type: query
      description: Zero-based page index (#561). Paging is applied to the id-level union of role-SUBSCRIBER members and subscription owners.
    - name: size
      value: "50"
      type: query
      description: Page size, 1-100. Directory lists were previously unbounded.
    - name: q
      value: ""
      type: query
      description: Optional case-insensitive email/name/product-title search. Blank returns the unfiltered page.
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });
        test("returns paging metadata", function() {
          expect(res.body.metadata).to.be.an("object");
          expect(res.body.metadata.page).to.equal(0);
          expect(res.body.metadata.size).to.equal(50);
          expect(res.body.metadata.totalElements).to.be.a("number");
        });
        test("subscription items expose period and Stripe ids", function() {
          expect(res.body.data).to.be.an("array");
          expect(res.body.data.length).to.be.at.most(res.body.metadata.size);
          res.body.data.forEach(function(row) {
            expect(row.subscriptions).to.be.an("array");
            row.subscriptions.forEach(function(item) {
              expect(item).to.have.property("source");
              expect(item).to.have.property("startedAt");
              expect(item).to.have.property("endsAt");
              expect(item).to.have.property("externalSubscriptionId");
            });
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lists tenant members with ROLE_SUBSCRIBER plus any users who have subscription rows.
  Paging is applied to the id-level union before hydration (#561).
  Each subscriptions[] item includes status, source, startedAt, endsAt, and
  externalSubscriptionId (Stripe subscription id, or null for grants / one-time).
  Response metadata carries page, size, and totalElements.
