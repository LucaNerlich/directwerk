info:
  name: 2 - Update Branding
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/tenant/branding"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "siteTitle": "Alpha Show A",
        "primaryColor": "#112233",
        "secondaryColor": "#445566",
        "logoUrl": "https://cdn.example.com/alpha-a/logo.png",
        "faviconUrl": "https://cdn.example.com/alpha-a/favicon.ico",
        "umamiWebsiteId": "12345678-abcd-abcd-abcd-abcdefabcdef",
        "umamiHostUrl": "https://umami.example.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
          expect(res.body.data.siteTitle).to.equal("Alpha Show A");
          expect(res.body.data.primaryColor).to.equal("#112233");
          expect(res.body.data.secondaryColor).to.equal("#445566");
          expect(res.body.data.faviconUrl).to.equal("https://cdn.example.com/alpha-a/favicon.ico");
          expect(res.body.data.umamiWebsiteId).to.equal("12345678-abcd-abcd-abcd-abcdefabcdef");
          expect(res.body.data.umamiHostUrl).to.equal("https://umami.example.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Colors are strict 6-digit hex (#rrggbb, validated both by @Pattern and
  TenantBrandingService.normalizeHexColor): missing # / 3-digit / named colors /
  CSS payloads return 400 VALIDATION_ERROR. Blank ("") clears a color to null;
  absent (null) leaves it untouched.
  logoUrl and faviconUrl must be absolute http(s) URLs (blank clears, absent
  leaves untouched); faviconUrl feeds the public site's browser-tab icon.
