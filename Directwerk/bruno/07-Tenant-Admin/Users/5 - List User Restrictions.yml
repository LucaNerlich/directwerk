info:
  name: 5 - List User Restrictions
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenant/users/{{editorUserId}}/restrictions"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lists the editor's deny-only permission overrides. Empty array means unrestricted (role baseline applies).
