info:
  name: 5 - Create Package Product
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tenant/products"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "slug": "{{packageProductSlug}}",
        "title": "Format Package",
        "sortOrder": 0,
        "offeringType": "PACKAGE"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("packageProductSlug", "package-" + Date.now().toString(36));
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 201 || res.getStatus() === 500).to.equal(true);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data && res.body.data.id
        method: jsonq
      variable:
        name: packageProductId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Same live-observed 500 as Products/2 - Create Product (LEVEL) -- see its docs note.
