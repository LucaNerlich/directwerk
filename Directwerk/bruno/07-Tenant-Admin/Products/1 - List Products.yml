info:
  name: 1 - List Products
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenant/products"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
          expect(res.body.data).to.be.an("array");
          if (res.body.data.length > 0) {
            expect(res.body.data[0]).to.have.property("priceCents");
            expect(res.body.data[0]).to.have.property("currency");
            expect(res.body.data[0]).to.have.property("billingInterval");
            expect(res.body.data[0]).to.have.property("stripeProductId");
            expect(res.body.data[0]).to.have.property("stripePriceId");
          }
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: (res.body.data.find(p => p.slug === "supporter") || {}).id
        method: jsonq
      variable:
        name: supporterProductId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Captures supporterProductId if a 'supporter' product happens to be seeded (optional, used by Subscriptions/1 - Grant Subscription).
