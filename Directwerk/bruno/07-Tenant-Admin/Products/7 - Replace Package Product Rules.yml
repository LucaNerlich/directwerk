info:
  name: 7 - Replace Package Product Rules
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/tenant/products/{{packageProductId}}/rules"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "rules": [
          {
            "scopeType": "FORMAT",
            "scopeId": {{podcastFormatId}}
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 400 || res.getStatus() === 404).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: podcastFormatId comes from 09-Podcast-Content/Formats/2 - Create Format. After this, 02-Me/Get My Access (as the subscriber) should list this package once they hold a subscription to it.
