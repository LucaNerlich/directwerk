info:
  name: 1 - Get Contact Email
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenant/contact-email"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
          expect(res.body.data).to.have.property("contactEmail");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Podcast-directory contact used in generated RSS/iTunes owner tags.
  Null means those tags are omitted from feeds.
