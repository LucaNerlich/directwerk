info:
  name: 3 - Update Contact Email Rejects Blank
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/tenant/contact-email"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "contactEmail": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects blank contact email", function() {
          expect(res.getStatus() === 400).to.equal(true);
          expect(res.body.errors[0].code).to.equal("VALIDATION_ERROR");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Blank/null contactEmail is rejected with 400 VALIDATION_ERROR.
  Podcast contact email is required for tenant-admin updates.
