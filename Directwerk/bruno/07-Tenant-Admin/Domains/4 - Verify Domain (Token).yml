info:
  name: 4 - Verify Domain (Token)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tenant/domains/{{newDomainHost}}/verify"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 400).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: DNS TXT required; use platform force-verify locally without DNS.
