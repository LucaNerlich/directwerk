info:
  name: 3 - Get Domain Verification Challenge
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenant/domains/{{newDomainHost}}/verification"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("domainVerifyToken", res.body.data && res.body.data.token);
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 400).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 400 if Add Domain above hit its known 409/500 re-run case and newDomainHost never got (re)captured.
