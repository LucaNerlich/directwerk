info:
  name: 4 - Content Get With Api Key
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/articles"
  headers:
    - name: Authorization
      value: "Bearer {{tenantApiKeySecret}}"
    - name: Accept
      value: application/json
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("API key can list articles", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Opaque Bearer content key against an editor content path (requires create step first).
