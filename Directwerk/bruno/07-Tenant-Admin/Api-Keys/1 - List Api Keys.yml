info:
  name: 1 - List Api Keys
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenant/api-keys"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200).to.equal(true);
        });
        test("returns an array of keys without secrets", function() {
          expect(res.body.data).to.be.an("array");
          if (res.body.data.length > 0) {
            expect(res.body.data[0]).to.have.property("id");
            expect(res.body.data[0]).to.have.property("prefix");
            expect(res.body.data[0]).to.have.property("scopes");
            expect(res.body.data[0]).to.not.have.property("secret");
            expect(res.body.data[0]).to.not.have.property("tokenHash");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lists active (non-revoked) tenant API keys. Raw secrets are never returned.
