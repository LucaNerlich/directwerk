info:
  name: 4 - Put Episode Template
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/tenant/content-email-templates/EPISODE"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "subjectTemplate": "New episode: {{title}}",
        "bodyHtml": "<p>Hi {{recipientName}},</p><p>{{siteTitle}} published <strong>{{title}}</strong>.</p><p>{{excerpt}}</p><p><a href=\"{{contentUrl}}\">Listen now</a></p><p><a href=\"{{preferencesUrl}}\">Manage preferences</a></p>"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 403).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
