info:
  name: 1 - Get Article Template
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/tenant/content-email-templates/ARTICLE"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          expect(res.getStatus() === 200 || res.getStatus() === 403).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Returns null data when no tenant override exists (classpath default is used).
