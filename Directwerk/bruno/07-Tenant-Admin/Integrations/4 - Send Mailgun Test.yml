info:
  name: 4 - Send Mailgun Test
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/tenant/integrations/esp/mailgun/test"
  body:
    type: none
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("sends test or returns structured config/admin error", function() {
          expect([200, 400, 401, 403].includes(res.getStatus())).to.equal(true);
          if (res.getStatus() === 200) {
            const body = res.getBody();
            expect(body.data).to.be.an("object");
            expect(body.data.sentCount).to.be.a("number");
            expect(body.data.failedCount).to.be.a("number");
            expect(body.data.results).to.be.an("array");
          }
          if (res.getStatus() === 400) {
            const body = res.getBody();
            const code = body.errors && body.errors[0] && body.errors[0].code;
            expect(["MAILGUN_NOT_CONFIGURED", "NO_TENANT_ADMINS"].includes(code)).to.equal(true);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |
  Sends one Mailgun test email to each active TENANT_ADMIN of the current tenant,
  using the tenant's connected Mailgun credentials. Requires TENANT_ADMIN.
  Error codes: MAILGUN_NOT_CONFIGURED, NO_TENANT_ADMINS.
