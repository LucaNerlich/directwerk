info:
  name: 5 - List Subscriptions
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/newsletter-lists/{{newsletterListId}}/subscriptions?limit=50"
  params:
    - name: limit
      value: "50"
      type: query
      description: 1-200, default 50. Bounds the subscriber (PII) page size.
  headers:
    - name: Host
      value: "{{tenantAHost}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
