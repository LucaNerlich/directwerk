info:
  name: Public Article Feed (ARTICLE_RSS off)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/feeds/{{tenantASlug}}/articles.xml"
  headers:
    - name: Accept
      value: application/rss+xml

runtime:
  scripts:
    - type: before-request
      code: |-
        function platformRequest(opts) {
          return new Promise((resolve, reject) => {
            bru.sendRequest(opts, (err, resp) => {
              if (err) return reject(err);
              resolve(resp);
            });
          });
        }
        const baseUrl = bru.getEnvVar("baseUrl");
        const tenantAId = bru.getVar("tenantAId") || bru.getEnvVar("tenantAId");
        const token = bru.getVar("platformAccessToken") || bru.getEnvVar("platformAccessToken");
        await platformRequest({
          url: baseUrl + "/api/v1/platform/tenants/" + tenantAId + "/modules/ARTICLE_RSS",
          method: "DELETE",
          headers: {
            Authorization: "Bearer " + token,
            Accept: "application/json"
          }
        });
    - type: after-response
      code: |-
        function platformRequest(opts) {
          return new Promise((resolve, reject) => {
            bru.sendRequest(opts, (err, resp) => {
              if (err) return reject(err);
              resolve(resp);
            });
          });
        }
        const baseUrl = bru.getEnvVar("baseUrl");
        const tenantAId = bru.getVar("tenantAId") || bru.getEnvVar("tenantAId");
        const token = bru.getVar("platformAccessToken") || bru.getEnvVar("platformAccessToken");
        try {
          await platformRequest({
            url: baseUrl + "/api/v1/platform/tenants/" + tenantAId + "/modules/ARTICLE_RSS/activate",
            method: "POST",
            headers: {
              Authorization: "Bearer " + token,
              Accept: "application/json"
            }
          });
        } catch (error) {
          console.error("Failed to restore ARTICLE_RSS after public article feed gate check", error);
          throw error;
        }
    - type: tests
      code: |-
        test("returns FEATURE_NOT_ENABLED", function() {
          expect(res.getStatus()).to.equal(403);
          expect(res.body.errors[0].code).to.equal("FEATURE_NOT_ENABLED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
