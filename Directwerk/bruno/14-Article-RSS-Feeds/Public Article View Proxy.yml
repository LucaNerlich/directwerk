info:
  name: Public Article View Proxy
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/feeds/{{tenantASlug}}/a/{{articleSlug}}"
  headers:
    - name: Accept
      value: text/html

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          const status = res.getStatus();
          expect(status === 302 || status === 403 || status === 404).to.equal(true);
          if (status === 403) {
            expect(res.body.errors[0].code).to.equal("FEATURE_NOT_ENABLED");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Tracked click-through (article-view rss-click), then 302 to canonical article page. Requires ARTICLE_RSS.
