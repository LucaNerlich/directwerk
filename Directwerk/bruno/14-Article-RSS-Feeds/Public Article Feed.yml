info:
  name: Public Article Feed
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/feeds/{{tenantASlug}}/articles.xml"
  headers:
    - name: Accept
      value: application/rss+xml

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns expected status", function() {
          const status = res.getStatus();
          expect(status === 200 || status === 302 || status === 403 || status === 404).to.equal(true);
          if (status === 403) {
            expect(res.body.errors[0].code).to.equal("FEATURE_NOT_ENABLED");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requires ARTICLE_RSS active for the tenant.
