plugins {
    id 'org.springframework.boot'
    id 'org.flywaydb.flyway'
}

dependencies {
    implementation project(':directwerk-common')
    implementation project(':directwerk-queue')
    implementation project(':directwerk-email')
    implementation project(':directwerk-core')
    implementation project(':directwerk-subscription')
    implementation project(':directwerk-stripe-billing')
    implementation project(':directwerk-digital')
    implementation project(':directwerk-podcast')
    implementation project(':directwerk-newsletter')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'org.altcha:altcha:2.0.3'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-quartz-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.h2database:h2'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
}

tasks.named('bootJar') {
    archiveFileName = 'directwerk-app.jar'
}

def flywayActiveProfile = System.getenv('SPRING_PROFILES_ACTIVE')
        ?: System.getProperty('spring.profiles.active')
        ?: ''

def directwerkPostgresPort = System.getenv('DIRECTWERK_POSTGRES_PORT')
        ?: project.findProperty('directwerkPostgresPort')
        ?: '5433'

flyway {
    url = System.getenv('FLYWAY_URL') ?: "jdbc:postgresql://localhost:${directwerkPostgresPort}/mydatabase"
    user = System.getenv('FLYWAY_USER') ?: System.getenv('SPRING_DATASOURCE_USERNAME')
    password = System.getenv('FLYWAY_PASSWORD') ?: System.getenv('SPRING_DATASOURCE_PASSWORD')
    locations = ['filesystem:src/main/resources/db/migration']
    cleanDisabled = flywayActiveProfile != 'local'
    // Leftover R__alpha_dev_seed rows from older local/docker runs.
    ignoreMigrationPatterns = ['repeatable:missing']
}

def openApiOutputFile = rootProject.layout.projectDirectory.file("../directwerk-docs/docs/openapi/directwerk-api.json")

tasks.register('exportOpenApi', Test) {
    description = 'Export OpenAPI spec (springdoc) to directwerk-docs/docs/openapi/directwerk-api.json'
    group = 'documentation'
    testClassesDirs = testing.suites.test.sources.output.classesDirs
    classpath = testing.suites.test.sources.runtimeClasspath
    useJUnitPlatform {
        includeTags 'openapi-export'
    }
    environment 'DIRECTWERK_PLATFORM_CLIENT_SECRET', System.getenv('DIRECTWERK_PLATFORM_CLIENT_SECRET') ?: 'openapi-export'
    environment 'DIRECTWERK_TENANT_CLIENT_SECRET', System.getenv('DIRECTWERK_TENANT_CLIENT_SECRET') ?: 'openapi-export'
    systemProperty 'openapi.output', openApiOutputFile.asFile.absolutePath
    // Always regenerate when invoked — Test result caching would otherwise skip after first run.
    outputs.file(openApiOutputFile)
    outputs.upToDateWhen { false }

    doLast {
        def out = openApiOutputFile.asFile
        if (!out.isFile()) {
            throw new GradleException("OpenAPI export failed — expected ${out} to exist")
        }
        logger.lifecycle("OpenAPI spec written to ${out} (${out.length()} bytes)")
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'openapi-export'
    }
}
