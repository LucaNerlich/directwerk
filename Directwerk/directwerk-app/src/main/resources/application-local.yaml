spring:
    config:
        import: optional:file:.env[.properties]
    docker:
        compose:
            enabled: true
    datasource:
        url: jdbc:postgresql://localhost:${DIRECTWERK_POSTGRES_PORT:5433}/mydatabase
        username: myuser
        password: ${SPRING_DATASOURCE_PASSWORD}
    jpa:
        show-sql: false
        properties:
            hibernate:
                format_sql: true
    flyway:
        clean-disabled: false
        out-of-order: false
    mail:
        properties:
            mail:
                smtp:
                    starttls:
                        enable: ${DIRECTWERK_MAIL_SMTP_STARTTLS:false}
    quartz:
        properties:
            org.quartz.scheduler.instanceName: DirectwerkScheduler
            org.quartz.scheduler.instanceId: AUTO
            org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            org.quartz.jobStore.tablePrefix: QRTZ_
            org.quartz.jobStore.isClustered: true
            org.quartz.jobStore.clusterCheckinInterval: 10000
            org.quartz.threadPool.threadCount: 5

logging:
    level:
        org.springframework.security: INFO
        org.flywaydb: INFO
        de.pnnit.directwerk: DEBUG

directwerk:
    security:
        issuer: http://localhost:8080
        platform-client-secret: ${DIRECTWERK_PLATFORM_CLIENT_SECRET}
        tenant-client-secret: ${DIRECTWERK_TENANT_CLIENT_SECRET}
    dev:
        seed-password: ${DIRECTWERK_DEV_SEED_PASSWORD}
        platform-admin-email: ${DIRECTWERK_DEV_PLATFORM_ADMIN_EMAIL:platform-admin@directwerk.local}
        platform-admin-password: ${DIRECTWERK_DEV_PLATFORM_ADMIN_PASSWORD}
    account:
        email-verification-required: false
        expose-dev-tokens: true
    email:
        from-address: ${DIRECTWERK_EMAIL_FROM:noreply@directwerk.local}
        studio-base-url: ${DIRECTWERK_EMAIL_STUDIO_BASE_URL:http://localhost:3004}
        admin-base-url: ${DIRECTWERK_EMAIL_ADMIN_BASE_URL:http://localhost:3001}
