# Local Flyway CLI defaults (match compose.yaml + ./gradlew flywayMigrate)
# Override via env: DIRECTWERK_POSTGRES_PORT, FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD
directwerkPostgresPort=5433

# Gradle performance — configuration cache reuses the configured build model between runs.
# See https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.caching=true
org.gradle.parallel=true
