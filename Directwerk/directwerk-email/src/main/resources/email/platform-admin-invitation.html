<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Platform admin invitation</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #1f2937;">
    <p>Hi {{recipientName}},</p>
    <p>You have been invited to become a platform administrator.</p>
    <p>
        <a href="{{acceptInviteUrl}}" style="display: inline-block; padding: 10px 16px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 4px;">
            Accept invitation
        </a>
    </p>
    <p>This invitation expires in {{expiresIn}}.</p>
    <p>If you did not expect this email, you can ignore it.</p>
</body>
</html>
