<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New episode</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #1f2937;">
    <p>Hi {{recipientName}},</p>
    <p><strong>{{siteTitle}}</strong> published a new episode:</p>
    <h2 style="margin: 0 0 8px 0;">{{title}}</h2>
    <p>{{excerpt}}</p>
    <p>
        <a href="{{contentUrl}}" style="display: inline-block; padding: 10px 16px; background: {{primaryColor}}; color: #ffffff; text-decoration: none; border-radius: 4px;">
            Listen now
        </a>
    </p>
    <p style="font-size: 12px; color: #6b7280;">
        You received this because you opted in to email updates from {{tenantName}}.
        <a href="{{preferencesUrl}}">Manage notification preferences</a>.
    </p>
</body>
</html>
