<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm subscription</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #1f2937;">
    <p>Please confirm your subscription to <strong>{{listName}}</strong>.</p>
    <p>
        <a href="{{confirmUrl}}" style="display: inline-block; padding: 10px 16px; background: #111827; color: #ffffff; text-decoration: none; border-radius: 4px;">
            Confirm subscription
        </a>
    </p>
    <p style="font-size: 12px; color: #6b7280;">
        This link expires in {{expiresIn}}. If you did not request this, you can ignore this email.
    </p>
</body>
</html>
